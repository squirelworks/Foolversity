[project]
name = "foolversity"
version = "1.0.0"
description = "Student, school, and curriculum files for Foolcourse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "foolcourse @ git+https://github.com/squirelworks/Foolcourse.git@v1.0.0",
]

[project.urls]
Repository = "https://github.com/squirelworks/Foolversity"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["foolversity*", "main*"]
